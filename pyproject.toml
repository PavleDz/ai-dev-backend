[project]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for the AI-DEV monorepo (Workshop 4): database, CRUD API, JWT auth"
readme = "README.md"
requires-python = ">=3.13,<4.0"

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.scripts]
start = "manage:poetry_start"
test = "manage:poetry_test"
typecheck = "manage:poetry_typecheck"
lint = "manage:poetry_lint"
makemigrations = "manage:poetry_makemigrations"
migrate = "manage:poetry_migrate"
seed = "manage:poetry_seed"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
fastapi = { extras = ["standard"], version = "^0.115.12" }
uvicorn = "^0.34.3"
sqlalchemy = "^2.0.41"
alembic = "^1.16.1"
pydantic = { extras = ["email"], version = "^2.11.5" }
pydantic-settings = "^2.9.1"
psycopg = { extras = ["binary"], version = "^3.2.9" }
python-dotenv = "^1.1.0"
kink = "^0.8.1"
pyhumps = "^3.8.0"
pyjwt = "^2.10.1"
bcrypt = "^4.3.0"

[tool.poetry.group.dev.dependencies]
mypy = "^1.16.1"
ruff = "^0.12.5"
black = "^25.1.0"
pytest = "^8.4.0"
pytest-cov = "^6.1.1"
# required for fastapi TestClient
httpx = "^0.28.1"

[tool.ruff]
line-length = 100
target-version = "py313"
# Alembic revisions are frozen snapshots generated by `makemigrations`; they are not linted.
extend-exclude = ["alembic/versions"]
lint.select = [
  "E",
  "F",
  "B",
  "I",
  "W",
  "C90",
  "UP",
  "RUF",
  "TID",
  "FAST",
  "TRY",
  "A",
  "C4",
  "DTZ",
  "PIE",
  "T20",
  "PT",
  "RSE",
  "RET",
  "SLF",
  "SIM",
  "ARG",
  "PTH",
  "N",
  "PERF",
  "FURB",
]
lint.ignore = ["UP017", "E501", "A002", "TRY300", "SIM107"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"kink.inject".msg = "Use `app.utils.di.inject` instead"
"sqlalchemy.DateTime".msg = "Use `sqlalchemy.TIMESTAMP` instead"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pep8-naming]
extend-ignore-names = ["*Exception"]


[tool.black]
line-length = 100
target-version = ["py313"]
extend-exclude = '''
/(
    \.venv
  | alembic/versions
)/
'''

[tool.mypy]
exclude = [".venv"]
plugins = ["pydantic.mypy"]
python_version = "3.13"
namespace_packages = true
explicit_package_bases = true

disable_error_code = "type-abstract" # DI error

allow_untyped_globals = false
strict_equality = true
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
disallow_any_unimported = true
disallow_untyped_calls = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
warn_return_any = true
local_partial_types = true
extra_checks = true
strict_bytes = true
enable_error_code = [
  "redundant-self",
  "deprecated",
  "redundant-expr",
  "possibly-undefined",
  "truthy-bool",
  "truthy-iterable",
  "ignore-without-code",
  "unused-awaitable",
  "unimported-reveal",
]

[[tool.mypy.overrides]]
module = ["kink.*", "humps.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--tb=short"]
markers = [
  "unit: Unit tests (fast, services mocked, no database)",
  "integration: Integration tests (real database)",
]
filterwarnings = [
  # Pydantic warns about Field() metadata under alias generators; known issue
  # https://github.com/pydantic/pydantic/issues/12362
  "ignore:The .* attribute.*was provided to the `Field\\(\\)` function:pydantic.warnings.UnsupportedFieldAttributeWarning",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
